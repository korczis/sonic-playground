term = "posse cut"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/Posse_cut"
see_also = ["rapping", "featured artist"]

[en]
definition = "A hip-hop track on which several rappers, often a whole crew, take turns with their own verses over one beat. Each voice gets a short spotlight, and the track becomes a showcase of how differently its MCs ride the same rhythm."

[cs]
term = "posse cut"
definition = "Hiphopová skladba, v níž se na jednom beatu střídá několik rapperů, často celá parta, každý s vlastní slokou. Každý hlas dostane krátký prostor a skladba se stává přehlídkou toho, jak odlišně se jednotliví MC chopí stejného rytmu."
