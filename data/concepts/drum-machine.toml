term = "drum machine"
category = "technology"
wikipedia = "https://en.wikipedia.org/wiki/Drum_machine"
see_also = ["four-on-the-floor", "sequencer", "roland tr-808"]

[en]
definition = "An electronic instrument that plays programmed drum patterns. Its machine-steady time and synthetic sounds became the foundation of hip-hop, house, techno and synth-pop."

[cs]
definition = "Elektronický nástroj přehrávající naprogramované bicí vzorce. Jeho strojově přesný čas a syntetické zvuky se staly základem hip-hopu, house, techna i synth-popu."
