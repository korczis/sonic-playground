term = "ambient texture"
category = "timbre"
wikipedia = "https://en.wikipedia.org/wiki/Ambient_music"
see_also = ["reverb", "drone"]

[en]
definition = "Layers of sustained, slowly changing sound that create atmosphere rather than melody or beat. Many electronic tracks open and close with them."

[cs]
definition = "Vrstvy dlouhých, pomalu se měnících zvuků, které tvoří atmosféru spíš než melodii nebo beat. Mnoho elektronických skladeb jimi začíná i končí."
