term = "melisma"
category = "melody"
wikipedia = "https://en.wikipedia.org/wiki/Melisma"
see_also = ["falsetto", "vocal harmony"]

[en]
definition = "Singing several notes on a single syllable, so the voice bends and runs through a phrase instead of moving one note per word. It is heard in Gregorian chant, gospel, soul and Middle Eastern singing alike, and it lets a singer show expression and agility."

[cs]
definition = "Zpěv několika tónů na jedinou slabiku, takže hlas frázi ohýbá a probíhá jí, místo aby na každé slovo připadl jeden tón. Zní v gregoriánském chorálu, gospelu, soulu i v blízkovýchodním zpěvu a dává zpěvákovi prostor ukázat výraz i hlasovou obratnost."
