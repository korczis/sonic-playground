term = "build-up"
category = "form"
wikipedia = "https://en.wikipedia.org/wiki/Drop_(music)#Build-up"
see_also = ["drop", "breakdown", "filter sweep"]

[en]
definition = "A passage that raises tension toward a release: rising pitch, faster drum rolls, opening filters, added layers. In dance music it prepares the drop."

[cs]
definition = "Pasáž, která stupňuje napětí k uvolnění: stoupající tón, zrychlující víření bubnů, otevírající se filtry, přibývající vrstvy. V taneční hudbě připravuje drop."
