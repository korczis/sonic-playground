term = "house groove"
category = "rhythm"
wikipedia = "https://en.wikipedia.org/wiki/House_music"
see_also = ["four-on-the-floor", "off-beat", "club culture"]

[en]
definition = "The rhythmic signature of house music: a four-on-the-floor kick, off-beat hi-hats and claps on two and four, at roughly 118 to 128 beats per minute."

[cs]
definition = "Rytmický podpis house: kopák na každou dobu, hi-haty na lehké době a tlesknutí na druhou a čtvrtou dobu, zhruba ve 118 až 128 úderech za minutu."
