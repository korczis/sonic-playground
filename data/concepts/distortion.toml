term = "distortion"
category = "timbre"
wikipedia = "https://en.wikipedia.org/wiki/Distortion_(music)"
see_also = ["synthesizer"]

[en]
definition = "Deliberately overdriving a signal so that it clips and gains harmonics: grit on a guitar, a bass or a vocal. It adds aggression and presence."

[cs]
definition = "Záměrné přebuzení signálu, takže se ořízne a získá vyšší harmonické: drsnost kytary, basy nebo hlasu. Přidává agresivitu a přítomnost."
