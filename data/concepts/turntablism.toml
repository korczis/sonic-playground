term = "turntablism"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/Turntablism"
see_also = ["sampling", "dj mix", "breakbeat"]

[en]
definition = "Playing the turntable as an instrument: scratching, cutting and juggling records by hand to make new rhythms and phrases rather than simply playing songs in sequence. It grew out of hip-hop DJing and has its own competitions, such as the DMC World DJ Championships."

[cs]
term = "turntablismus"
definition = "Hra na gramofon jako na nástroj: scratching, střihy a žonglování s deskami rukama tak, aby vznikaly nové rytmy a fráze, nikoli jen přehrávání skladeb za sebou. Vyrostl z hiphopového DJingu a má vlastní soutěže, například mistrovství světa DMC."
