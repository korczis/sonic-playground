[en]
definition = "A drum machine released in 1980 whose booming kick, snappy snare and cowbell became some of the most used sounds in popular music, from electro and hip-hop to trap."

[cs]
definition = "Bicí automat z roku 1980, jehož dunivý kopák, ostrý virbl a kravský zvonec patří k nejpoužívanějším zvukům populární hudby, od electra a hip-hopu po trap."
