term = "breakbeat"
category = "rhythm"
wikipedia = "https://en.wikipedia.org/wiki/Breakbeat"
see_also = ["sampling", "syncopation"]

[en]
definition = "A drum pattern taken from the instrumental break of a funk or soul record, or written in its style: kick and snare are syncopated rather than evenly spaced. Breakbeats drive hip-hop, big beat, jungle and drum and bass."

[cs]
definition = "Bicí vzorec převzatý z instrumentálního „breaku“ funkové nebo soulové desky, nebo napsaný v jeho duchu: kopák a virbl jsou synkopované, ne rovnoměrně rozložené. Breakbeat pohání hip-hop, big beat, jungle i drum and bass."
