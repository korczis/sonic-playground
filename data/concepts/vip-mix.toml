term = "vip mix"
category = "production"
see_also = ["remix", "dubplate", "alternate version"]

[en]
definition = "A new version of a track made by its own producer, often first for DJ sets: a reworked drop, new sounds or a rebuilt arrangement of a tune the crowd already knows. In jungle and drum and bass the name grew out of DJ-exclusive dubplate culture and is now often read as Variation In Production."

[cs]
term = "VIP mix"
definition = "Nová verze skladby, kterou vytvoří její vlastní producent, často nejprve pro DJské sety: přepracovaný drop, nové zvuky nebo přestavěné aranžmá skladby, kterou publikum už zná. V jungle a drum and bass název vyrostl z kultury exkluzivních dubplatů pro DJe a dnes se často vykládá jako Variation In Production."
