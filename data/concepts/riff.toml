term = "riff"
category = "melody"
wikipedia = "https://en.wikipedia.org/wiki/Riff"
see_also = ["hook", "ostinato"]

[en]
definition = "A short, repeated melodic or rhythmic figure, usually played by an instrument, that anchors a song. Rock riffs are often guitar figures; in electronic music the same role falls to a synth or bass line."

[cs]
term = "riff"
definition = "Krátký opakovaný melodický nebo rytmický útvar, obvykle hraný nástrojem, který píseň ukotvuje. V rocku jde často o kytaru, v elektronické hudbě tuto roli přebírá syntezátor nebo basa."
