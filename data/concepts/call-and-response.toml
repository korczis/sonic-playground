term = "call and response"
category = "melody"
wikipedia = "https://en.wikipedia.org/wiki/Call_and_response_(music)"
see_also = ["hook", "vocal harmony"]

[en]
definition = "One phrase is answered by another: a lead voice and a choir, a vocal and an instrument. It comes from African and African-American traditions and runs through gospel, soul, funk and house."

[cs]
definition = "Jedna fráze je zodpovězena druhou: sólový hlas a sbor, zpěv a nástroj. Pochází z afrických a afroamerických tradic a prochází gospelem, soulem, funkem i house."
