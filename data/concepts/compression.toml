term = "compression"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Dynamic_range_compression"
see_also = ["sidechain compression"]

[en]
definition = "Reducing the difference between the loud and quiet parts of a sound. Compression makes vocals and drums sit forward and steady; pushed hard, it becomes an audible effect."

[cs]
term = "komprese"
definition = "Zmenšení rozdílu mezi hlasitými a tichými místy zvuku. Komprese posune zpěv a bicí dopředu a zklidní je; při silném nastavení se stane slyšitelným efektem."
