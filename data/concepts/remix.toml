term = "remix"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Remix"
see_also = ["sampling", "extended mix"]

[en]
definition = "A new version of a recording made by reworking its parts: changing the beat, harmony, tempo or structure, often by another producer. A remix can turn a ballad into a club track."

[cs]
term = "remix"
definition = "Nová verze nahrávky vzniklá přepracováním jejích částí: změnou beatu, harmonie, tempa nebo stavby, často jiným producentem. Remix může z balady udělat klubovou skladbu."
