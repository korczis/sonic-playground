term = "soundtrack"
category = "culture"
wikipedia = "https://en.wikipedia.org/wiki/Soundtrack"
see_also = ["music video"]

[en]
definition = "Music written for or placed in a film, series or game. A placement can give a song a second life and an audience far beyond its genre."

[cs]
term = "soundtrack"
definition = "Hudba napsaná pro film, seriál nebo hru, nebo do nich zařazená. Taková volba může písni dát druhý život a publikum daleko za hranicemi žánru."
