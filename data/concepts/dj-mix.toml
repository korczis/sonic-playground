term = "dj mix"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/DJ_mix"
see_also = ["extended mix", "club culture"]

[en]
definition = "A continuous sequence of tracks blended by a DJ so that one flows into the next. Extended and club mixes exist so that DJs have long intros and outros to mix with."

[cs]
definition = "Plynulý sled skladeb, které DJ propojí tak, aby jedna přecházela v druhou. Extended a klubové verze existují proto, aby DJ měl dlouhé intro a outro na mixování."
