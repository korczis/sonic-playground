term = "sampling"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Sampling_(music)"
see_also = ["loop", "breakbeat", "remix"]

[en]
definition = "Taking a fragment of an existing recording and reusing it in a new one, as a loop, a chop or a texture. Sampling is central to hip-hop and dance music and raises questions of credit and copyright."

[cs]
definition = "Převzetí úryvku existující nahrávky a jeho použití v nové, jako smyčky, nasekaného útržku nebo textury. Sampling je jádrem hip-hopu a taneční hudby a otevírá otázky autorství a práv."
