term = "featured artist"
category = "culture"
wikipedia = "https://en.wikipedia.org/wiki/Featured_artist"
see_also = ["call and response", "remix"]

[en]
definition = "A guest performer credited on another artist's track, usually as \"feat.\": a rapper's verse, a singer's hook or a second voice. Features bring together different styles and audiences and are central to hip-hop, R&B and dance music."

[cs]
definition = "Hostující interpret uvedený na skladbě jiného umělce, obvykle jako „feat.“: rapová sloka, zpěvaný refrén nebo druhý hlas. Spolupráce propojují různé styly i publika a jsou základem hip-hopu, R&B a taneční hudby."
