term = "alternate version"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Alternate_take"
see_also = ["remix", "radio edit", "extended mix"]

[en]
definition = "A second finished recording of the same song by the same artist, with a different arrangement, tempo or sound rather than a reworking by another producer. Comparing two versions shows how much of a song's mood comes from production rather than from melody and words."

[cs]
definition = "Druhá hotová nahrávka téže písně od téhož interpreta, s jiným aranžmá, tempem nebo zvukem, nikoli přepracování jiným producentem. Srovnání obou verzí ukazuje, kolik nálady písně dělá produkce, a ne melodie a text."
