term = "fingerstyle guitar"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/Fingerstyle_guitar"
see_also = ["riff", "ostinato"]

[en]
definition = "Playing the guitar by plucking the strings with the fingertips or nails instead of strumming with a pick. One player can then carry a bass line, chords and melody at once, and tapping or slapping the strings and body can add percussion."

[cs]
definition = "Hra na kytaru, při níž hráč struny drnká konečky prstů nebo nehty místo trsátka. Jeden kytarista tak může zároveň hrát basovou linku, akordy i melodii a poklepáváním na struny či tělo nástroje přidat i perkuse."
