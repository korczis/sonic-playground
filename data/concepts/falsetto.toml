term = "falsetto"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/Falsetto"
see_also = ["vocal harmony"]

[en]
definition = "A light, high register of the voice above its normal range. Disco, soul and much contemporary pop use falsetto for a weightless, intimate or euphoric effect."

[cs]
definition = "Lehký, vysoký hlasový rejstřík nad běžným rozsahem. Disco, soul i současný pop využívají falzet pro beztížný, intimní nebo euforický účinek."
