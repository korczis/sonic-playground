[en]
definition = "The African-American music born in the Deep South around the start of the 20th century, built on call and response, bent \"blue\" notes and short repeating forms such as the twelve-bar blues. Almost every later popular style, from rock and soul to house, carries some of its scales and phrasing."

[cs]
definition = "Afroamerická hudba, která vznikla na hlubokém americkém Jihu kolem přelomu 19. a 20. století a stojí na principu výzvy a odpovědi, ohýbaných „modrých“ tónech a krátkých opakujících se formách, jako je dvanáctitaktové blues. Téměř každý pozdější populární styl, od rocku a soulu po house, nese něco z jeho stupnic a frázování."
