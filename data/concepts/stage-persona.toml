term = "stage persona"
category = "culture"
wikipedia = "https://en.wikipedia.org/wiki/Alter_ego"
see_also = ["music video", "featured artist"]

[en]
definition = "An invented identity that a musician performs as: a mask, a character, a cartoon band or a pair of robots. A persona lets artists play with fame and image, keep their private selves hidden, and make the character part of the music's meaning."

[cs]
definition = "Vymyšlená identita, v níž hudebník vystupuje: maska, postava, kreslená kapela nebo dvojice robotů. Persona umožňuje hrát si se slávou a image, skrýt soukromou osobu a učinit z postavy součást významu hudby."
