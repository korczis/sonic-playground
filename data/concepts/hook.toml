term = "hook"
category = "melody"
wikipedia = "https://en.wikipedia.org/wiki/Hook_(music)"
see_also = ["call and response", "verse-chorus form"]

[en]
definition = "The short, memorable idea a song is built to stick with you: a sung phrase, a riff, a synth line. A hook is designed for repetition and usually arrives early."

[cs]
term = "hook"
definition = "Krátký, zapamatovatelný nápad, kvůli kterému píseň „uvízne“ v hlavě: zpívaná fráze, riff nebo syntezátorová linka. Hook je stavěný na opakování a obvykle zazní brzy."
