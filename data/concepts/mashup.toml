term = "mashup"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Mashup_(music)"
see_also = ["sampling", "remix"]

[en]
definition = "A track made by laying parts of two or more existing recordings on top of each other, typically the vocal of one song over the instrumental of another. Its art lies in finding songs whose tempo, key and phrasing line up."

[cs]
definition = "Skladba vzniklá vrstvením částí dvou či více existujících nahrávek, nejčastěji vokálu jedné písně přes instrumentál jiné. Umění spočívá v nalezení písní, jejichž tempo, tónina a frázování do sebe zapadnou."
