term = "delay"
category = "timbre"
wikipedia = "https://en.wikipedia.org/wiki/Delay_(audio_effect)"
see_also = ["reverb", "dub"]

[en]
definition = "An effect that repeats a sound after a set time, often several times and fading. Echoes timed to the tempo add rhythm; dub turned delay into an instrument of its own."

[cs]
definition = "Efekt, který zvuk po nastavené době zopakuje, často několikrát a slábnoucí. Ozvěny sladěné s tempem přidávají rytmus; dub z delaye udělal samostatný nástroj."
