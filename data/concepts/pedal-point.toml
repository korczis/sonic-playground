term = "pedal point"
category = "harmony"
wikipedia = "https://en.wikipedia.org/wiki/Pedal_point"
see_also = ["chord progression", "drone"]

[en]
definition = "A note held or repeated, usually in the bass, while the chords above it change. It builds tension because the harmony keeps moving against something that does not."

[cs]
definition = "Tón držený nebo opakovaný, obvykle v basu, zatímco se akordy nad ním mění. Buduje napětí, protože harmonie se pohybuje proti něčemu, co stojí."
