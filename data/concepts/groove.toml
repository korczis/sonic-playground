term = "groove"
category = "rhythm"
wikipedia = "https://en.wikipedia.org/wiki/Groove_(music)"
see_also = ["syncopation", "swing", "bassline"]

[en]
definition = "The felt quality of a rhythm that makes people move: how drums, bass and the other parts lock together and push against each other in time."

[cs]
definition = "Pociťovaná kvalita rytmu, která lidi rozhýbe: jak do sebe bicí, basa a ostatní nástroje časově zapadají a jak se o sebe opírají."
