term = "dubplate"
category = "culture"
wikipedia = "https://en.wikipedia.org/wiki/Dubplate"
see_also = ["club culture", "dub", "dj mix"]

[en]
definition = "A one-off disc cut to preview a recording before it is pressed. Jamaican sound systems used dubplates to play music nobody else had, and jungle and drum and bass DJs kept the habit: a track played from a dub, often for months before its release, is an exclusive that only one DJ or crew can drop."

[cs]
term = "dubplate"
definition = "Jednorázově vyřezaná deska, na které se nahrávka poslouchala před lisováním. Jamajské sound systémy na dubplatech hrály hudbu, kterou nikdo jiný neměl, a DJové jungle a drum and bass tento zvyk převzali: skladba hraná z dubu, často celé měsíce před vydáním, je exkluzivita, kterou může pustit jen jeden DJ nebo jedna crew."
