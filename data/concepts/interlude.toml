term = "interlude"
category = "form"
wikipedia = "https://en.wikipedia.org/wiki/Intermezzo"
see_also = ["ambient texture", "breakdown"]

[en]
definition = "A short piece placed between the main songs of an album or EP to connect them. It usually drops verses and choruses in favour of a mood or a single idea, and works as a pause that shapes how the songs around it are heard."

[cs]
term = "mezihra"
definition = "Krátká skladba zařazená mezi hlavní písně alba nebo EP, která je propojuje. Obvykle se obejde bez slok a refrénů, nese spíš náladu nebo jediný nápad a funguje jako předěl, který ovlivňuje, jak posluchač vnímá okolní skladby."
