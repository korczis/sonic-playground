term = "drop"
category = "form"
wikipedia = "https://en.wikipedia.org/wiki/Drop_(music)"
see_also = ["build-up", "breakdown"]

[en]
definition = "The moment after a build-up when the full beat and bassline return, often after a short silence. It is the release the arrangement has been preparing."

[cs]
definition = "Okamžik po build-upu, kdy se vrátí plný beat a basa, často po krátkém tichu. Je to uvolnění, které aranžmá připravovalo."
