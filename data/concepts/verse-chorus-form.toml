term = "verse-chorus form"
category = "form"
wikipedia = "https://en.wikipedia.org/wiki/Verse%E2%80%93chorus_form"
see_also = ["hook", "bridge"]

[en]
definition = "The common song structure that alternates verses (new words over similar music) with a recurring chorus (the same words and the hook). Most pop songs follow it."

[cs]
term = "forma sloka–refrén"
definition = "Běžná stavba písně, v níž se střídají sloky (nová slova na podobnou hudbu) s opakujícím se refrénem (stejná slova a hook). Řídí se jí většina popových písní."
