term = "lo-fi"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Lo-fi_music"
see_also = ["drum machine", "reverb", "mixing"]

[en]
definition = "Music recorded with modest means, often at home, that keeps the marks of its making: room noise, simple equipment, imperfect takes. Lo-fi can be a necessity or a deliberate aesthetic, and many listeners hear it as more intimate than polished studio sound."

[cs]
definition = "Hudba nahraná skromnými prostředky, často doma, která si ponechává stopy svého vzniku: šum místnosti, jednoduché vybavení, nedokonalé záznamy. Lo-fi může být nutnost i záměrná estetika a mnoho posluchačů ho vnímá jako intimnější než uhlazený studiový zvuk."
