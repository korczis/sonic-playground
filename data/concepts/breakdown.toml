term = "breakdown"
category = "form"
wikipedia = "https://en.wikipedia.org/wiki/Breakdown_(music)"
see_also = ["build-up", "drop"]

[en]
definition = "A section where the beat drops out or thins, leaving pads, melody or vocals. On a dance floor it gives a moment to breathe before the music builds back."

[cs]
definition = "Část, kde beat zmizí nebo zeslábne a zůstanou plochy, melodie nebo zpěv. Na tanečním parketu dává chvíli k nadechnutí, než se hudba znovu rozjede."
