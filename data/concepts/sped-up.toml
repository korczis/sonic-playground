term = "sped up"
category = "production"
wikipedia = "https://en.wikipedia.org/wiki/Nightcore"
see_also = ["alternate version", "pitch shifting", "remix"]

[en]
definition = "A version of a recording played back faster, so that its pitch rises with its tempo, the way a record sounds at the wrong speed. Fan edits of this kind, known earlier as nightcore, spread on TikTok in the early 2020s, and labels and artists began releasing official sped-up versions of their own songs."

[cs]
term = "zrychlená verze"
definition = "Verze nahrávky přehrávaná rychleji, takže se s tempem zvedá i výška tónu, jako když deska běží na špatné rychlosti. Fanouškovské úpravy tohoto druhu, dříve známé jako nightcore, se na počátku 20. let 21. století rozšířily na TikToku a vydavatelství i interpreti začali vydávat oficiální zrychlené verze vlastních písní."
