term = "drone"
category = "timbre"
wikipedia = "https://en.wikipedia.org/wiki/Drone_(music)"
see_also = ["pedal point", "ambient texture"]

[en]
definition = "A sustained sound or chord held under the music for a long time. Drones give ambient and psychedelic music its sense of space and suspension."

[cs]
definition = "Dlouze držený zvuk nebo akord pod hudbou. Drony dávají ambientní a psychedelické hudbě pocit prostoru a zavěšení v čase."
