term = "electroclash"
category = "genre-history"
wikipedia = "https://en.wikipedia.org/wiki/Electroclash"
see_also = ["synthesizer", "drum machine", "club culture"]

[en]
definition = "A late-1990s and early-2000s scene that fused 1980s electro, synth-pop and new wave with punk attitude, deadpan vocals and a taste for fashion and performance. It grew around labels such as International DeeJay Gigolo in Munich and clubs in New York, Berlin and Paris."

[cs]
definition = "Scéna konce 90. let a počátku nultých let, která spojila electro, synth-pop a novou vlnu 80. let s punkovým postojem, odměřeným zpěvem a zálibou v módě a performanci. Vyrostla kolem labelů jako mnichovský International DeeJay Gigolo a klubů v New Yorku, Berlíně a Paříži."
