term = "spoken word"
category = "performance"
wikipedia = "https://en.wikipedia.org/wiki/Spoken_word"
see_also = ["hook", "vocoder"]

[en]
definition = "A vocal delivered as speech rather than song: talked, recited or half-sung with little or no melody. In electronic and post-punk music a flat, deadpan spoken voice over a beat can sound cool, ironic or confrontational."

[cs]
definition = "Vokál podaný jako řeč, nikoli zpěv: mluvený, recitovaný nebo napůl zpívaný téměř bez melodie. V elektronické hudbě a post-punku může plochý, nevzrušený mluvený hlas nad beatem znít chladně, ironicky nebo vyzývavě."
