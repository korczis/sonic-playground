[en]
definition = "A shortened version of a track for radio and streaming: a quicker start, fewer repeats, usually three to four minutes."

[cs]
definition = "Zkrácená verze skladby pro rádio a streamování: rychlejší začátek, méně opakování, obvykle tři až čtyři minuty."
