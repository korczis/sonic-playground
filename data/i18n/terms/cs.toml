# Czech labels of the taxonomy terms (ADR 0006). A term keeps one identity in both languages, its
# key here and in the reviews' taxonomies (/genre/deep-house/ and /cs/genre/deep-house/); this is
# only what a Czech page shows. Concepts are labelled in data/concepts/<slug>.toml ([cs] term).
# scripts/i18n.py bundles them as term.<facet>.<term> and refuses a term in use without a label.
#
# Conventions: a genre name Czech uses as a loanword stays as it is (house, techno, synth-pop);
# a feeling is a feminine adjective agreeing with "skladba" (melancholic: melancholická); an
# instrument is its Czech name.

