# User-interface strings, English (the default language, config.toml default_language).
# Flat keys, the same set in every locale (scripts/i18n.py --check). Placeholders are {name}
# and must be the same in every locale. Templates render the default; static/js/i18n.js
# switches the page to another locale from static/data/i18n.json (derived from these files).
# Reviews and facet terms are content, not interface: they stay in the language they are written.

