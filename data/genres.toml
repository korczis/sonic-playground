# The genre families: every genre term the reviews use (taxonomies.genre), grouped once into the
# family a listener looks for first. scripts/catalog.py derives from it each family's tracks and
# counts (catalog.genre_families), and scripts/i18n.py its label in every locale
# ("genre.family.<id>"). The sidebar, the genre index, the home page, the explorer and the charts
# browse by family, so a specific scene (techno, minimal, dub, drum and bass, jungle) is never
# hidden behind the umbrella terms that outnumber it ("electronic", "house", "pop").
#
# A term is in exactly one family. A term no family lists yet is placed by inference (the family
# of the listed term it shares the most reviews with) and reported by scripts/catalog.py; add it
# here to make the placement written. Families are shown largest first, an `umbrella` family
# (terms that name no scene) after every other; the order here is only the order of reading.

[[family]]
id = "techno"
en = "Techno & minimal"
cs = "Techno a minimal"
terms = ["techno", "minimal", "minimal techno", "melodic techno", "detroit techno", "dark techno",
         "industrial", "dark electronic", "ebm"]

[[family]]
id = "house"
en = "House"
cs = "House"
terms = ["house", "deep house", "tech house", "electro-house", "french house", "progressive house",
         "tropical house", "melodic house", "future house", "acid house", "hip house", "slap house",
         "big room", "balearic"]

