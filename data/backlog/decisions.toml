# Identity decisions on items of the owner's Spotify history (data/spotify/, ADR 0007) that the
# catalogue's own resolution gets wrong: skip= for an item that is not a song, review= for a song
# that already has a review under another spelling. The derive applies them to the Spotify
# records, and scripts/backlog.py --source spotify then no longer lists the item.
kind = "decisions"
source = "Integrator decisions while writing the Spotify waves, 2026-11-20"

