default:
  image: rust:latest  # Use rust image to install Zola easily
  before_script:
    # Install Flyctl
    - apt-get update -qq && apt-get install -y curl
    - curl -L https://fly.io/install.sh | sh
    # Add Flyctl to the PATH
    - export FLYCTL_INSTALL="$HOME/.fly"
    - export PATH="$FLYCTL_INSTALL/bin:$PATH"
    # Install Zola
    # - cargo install --path . --locked
    # Verify Zola installation
    # - zola --version

deploy:
  script:
    # Build your Zola site
    # - zola build
    # Deploy the site using Flyctl
    - flyctl deploy