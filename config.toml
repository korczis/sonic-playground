# Zola: Sonic Playground. Only what Zola itself reads lives here; everything the templates show
# about the tracks comes from static/data/catalog.json (scripts/catalog.py, derived from the
# front matter). CI builds with the GitHub Pages URL and checks it equals base_url.
base_url = "https://korczis.github.io/sonic-playground"
title = "Sonic Playground"
description = "Discover music that moves you, not algorithmic noise. Hand-picked, authentic, and sometimes messy, just like life."
author = "korczis"
default_language = "en"
compile_sass = false
minify_html = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true

# Every facet is a taxonomy with its own listing and feed; data/track.schema.json declares the
# same set (scripts/catalog.py refuses any other). A declared taxonomy no article uses would be
# listed in sitemap.xml without a page (a 404): add one only with its first article.
taxonomies = [
  { name = "genre", feed = true, paginate_by = 24 },
  { name = "sentiment", feed = true, paginate_by = 24 },
  { name = "mood", feed = true, paginate_by = 24 },
  { name = "concept", feed = true, paginate_by = 24 },
  { name = "instrument", feed = true, paginate_by = 24 },
]

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
smart_punctuation = true

[markdown.highlighting]
style = "class"
theme = "github-dark"
error_on_missing_language = false

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
author = "korczis"
repo_url = "https://github.com/korczis/sonic-playground"
since = 2024
license = "CC BY-SA 4.0"
license_url = "https://creativecommons.org/licenses/by-sa/4.0/"
x_handle = "@korczis"

