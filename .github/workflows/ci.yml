name: CI

# Runs on pull requests and non-main branches, and is called by pages.yml for main, so the gate
# in front of a deployment is exactly the gate in front of a merge.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The last commit before the convention was adopted; older subjects are history.
      ADOPTION_BASE: e32d2caf84b8c82000bfc058d1b7b6c8a39d3731
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$GITHUB_SHA}"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$head"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$ADOPTION_BASE" "$PUSH_BEFORE"; then
            range="$PUSH_BEFORE..$head"
          else
            range="$ADOPTION_BASE..$head"
          fi
          scripts/lint-commits.sh "$range"

  supervision:
    name: Majordomus supervision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAJORDOMUS_VERSION: v1.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install majordomus (pinned; the installer verifies the SHA-256 of the release)
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: majordomus doctor
        env:
          # kit-evidence/v1 of the owner's Flowbite Pro licence: the never-publish gate refuses a
          # licensed file in this public tree, and fails closed without the evidence.
          MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO: ${{ secrets.MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO }}
        run: |
          git config core.hooksPath .githooks
          majordomus version
          majordomus doctor
      - name: Skills, decisions and knowledge are valid
        run: |
          majordomus skills check
          majordomus skills verify
          majordomus adr check
          majordomus knowledge validate
          majordomus shell check

  site:
    name: Validate, build and test in a browser
    runs-on: ubuntu-latest
    # The smoke test sweeps every sitemap page (3,700+ and growing with each content wave): one
    # job outgrew 20 minutes at 717 reviews (run 44569679140), so the sweep is split in SHARDS
    # (test/e2e/smoke.cjs SMOKE_SHARD): this job runs the feature checks and the first shard, the
    # job sweep the others on the very artefact this job uploads. Its feature checks alone took
    # 29 minutes in run 46169709672 (the versions section, the visualiser's 10 s harmony window),
    # 22 before: 40 minutes cancelled the job before its shard of the sweep.
    timeout-minutes: 55
    env:
      SMOKE_SHARD: 1/4
      # New code is tested (scripts/coverage.mjs): the change is judged from the pull request's
      # base, or from the commit before the push; the history must be there to diff against.
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Browser for the smoke test (Playwright's chromium, no system packages)
        run: npx playwright-core install chromium
      # One build, with the production base_url, tested in a browser as production; the same
      # directory is the artefact pages.yml deploys (plus revision.txt, the commit it is).
      - name: Gate (catalogue, tests, skill cases, assets, zola build, built-site check, browser smoke)
        env:
          SMOKE_REQUIRED: '1'
          PUBLIC_DIR: public
        run: bash scripts/verify.sh
      - name: Stamp the tested artefact with its commit
        run: printf '%s\n' "$GITHUB_SHA" > public/revision.txt
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          if-no-files-found: error
          retention-days: 7

  sweep:
    name: Sweep shard ${{ matrix.shard }} of 4
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Browser for the smoke test (Playwright's chromium, no system packages)
        run: npx playwright-core install chromium
      - name: Download the artefact the site job built and tested
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public
      - name: Sweep this shard of the sitemap, served as production
        env:
          SMOKE_SWEEP: only
          SMOKE_SHARD: ${{ matrix.shard }}/4
        run: |
          base_url="$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["base_url"])')"
          node test/e2e/smoke.cjs --artifact public --as "$base_url"
