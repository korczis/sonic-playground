# The mesh of this repository: its shared servers find each other, link, and share one
# journal of sessions, claims, handovers and reviews. Seeded by `majordomus init`.
#
# Closed until enrolled: under `deny_unknown`, a machine whose public key is not listed in
# trust.allow opens no socket at all. `majordomus mesh enrol` adds this machine's key;
# commit the change, and every enrolled machine of the repository trusts it.
#
# Discovery: multicast on the local segment only (TTL 1). Add rendezvous endpoints for
# segments multicast does not reach.
schema: mesh/v1
kind: mesh-declaration
id: mesh
enabled: true
multicast:
  enabled: true
  ttl: 1
broadcast:
  mode: disabled
rendezvous:
  endpoints:
    - http://192.168.100.30:8791
    - http://100.92.246.32:8791
    - http://192.168.100.10:8791
    - http://100.65.22.118:8791
    - http://100.120.245.51:8791
    - http://100.108.237.68:8791
  interval_seconds: 30
tailscale:
  enabled: true
trust:
  policy: deny_unknown
  allow:
    - 946e8aa593fe16c58d5eb43493338810896cd10bc6bdd44ffa8e9bfebd37ca1f  # 641bdb94 MacBook Pro
    - 3f7b357805aa15ecdb3c1ace7e7ac02de263e3d0def8aafda9ad280d3af7c813  # 5d81b5c9 second MacBook Pro
    - aaadec268d02d8d43bfa3c3a7a5aacf8f3d80308fcbc513913f5d74d079621f7  # aaba18ea iMac (imac-4)
    - f945cae627707f2df99d292285414e40635e2baa5ae3b1a5243ab854334fe6e9  # 9d652b2c jetson (hub)
    - 7cf4caea612d67ac8b75ea090acd8a9d1c0051d53aac3fcfd18ee59ca8aedf4c  # 25c9758f lundra (hub)
