<header class="{% if config.extra.style.header_blur %}blur-header{% else %}header{% endif %} fixed top-0 z-40 mx-auto min-h-[3.5rem] w-full">
  <div class="mx-auto w-full max-w-4xl p-3 lg:flex lg:justify-between">
    <div class="flex justify-between">
      <div class="flex items-center">
        <a class="text-2xl font-semibold" href="{{ get_url(path=``) }}">{{ config.title }}</a>
      </div>
      {% if config.extra.menu %}
      <div class="btn-menu relative z-50 flex h-8 w-8 shrink-0 cursor-pointer flex-col items-center justify-center gap-2.5 lg:hidden" role="button" aria-label="Menu">
        <span class="block h-0.5 w-full bg-black"></span>
        <span class="block h-0.5 w-full bg-black"></span>
        <span class="block h-0.5 w-full bg-black"></span>
      </div>
      {% endif %}
    </div>

    <nav class="flex w-full items-center lg:w-auto">
      <ul class="nav-wrapper flex-col py-2 lg:flex lg:flex-row lg:self-center lg:py-0">
        {% for menu in config.extra.menu %}
        <li>
          <a class="primary-link block py-2 text-center text-lg font-medium lg:px-3 lg:py-0" href="{{ menu.url | replace(from=`$BASE_URL`, to=config.base_url) | safe }}">
            {{ menu.name }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script>
    // base
    const htmlClass = document.documentElement.classList;
    setTimeout(() => {
      htmlClass.remove("not-ready");
    }, 10);

    // mobile menu
    const btnMenu = document.querySelector(".btn-menu");
    const navWrapper = document.querySelector(".nav-wrapper");
    btnMenu?.addEventListener("click", () => {
      navWrapper.classList.toggle("hidden");
      htmlClass.toggle("open");
    });

    // Ensure navWrapper is hidden by default on mobile
    navWrapper.classList.add("hidden");

    // dark theme
    const setDark = (isDark) => {
      if (isDark) {
        document.body.dispatchEvent(new CustomEvent("set-theme", { detail: "dark" }));
        htmlClass.add("dark");
      } else {
        document.body.dispatchEvent(new CustomEvent("set-theme", { detail: "light" }));
        htmlClass.remove("dark");
      }
      localStorage.setItem("dark", isDark);
    };

    // init
    const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");
    if (htmlClass.contains("dark")) {
      setDark(true);
    } else {
      const darkVal = localStorage.getItem("dark");
      setDark(darkVal ? darkVal === "true" : darkScheme.matches);
    }

    // listen system
    darkScheme.addEventListener("change", (event) => {
      setDark(event.matches);
    });
  </script>
</header>
